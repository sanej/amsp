<svg width="680" height="512" viewBox="0 0 680 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent stack positioning of AMSP</title>
  <desc id="desc">Six-layer agent interoperability stack. From top: application, orchestration, agent interop (A2A), tool access (MCP), memory and state interop (AMSP — highlighted), and runtime and storage. AMSP is the missing layer between tool access and runtime storage.</desc>

  <style>
    .layer-rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #444441; }
    .layer-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .amsp-rect { fill: #FAECE7; stroke: #993C1D; }
    .amsp-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #712B13; }
    .amsp-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #993C1D; }
    @media (prefers-color-scheme: dark) {
      .layer-rect { fill: #2C2C2A; stroke: #B4B2A9; }
      .layer-title { fill: #F1EFE8; }
      .layer-sub { fill: #D3D1C7; }
      .amsp-rect { fill: #712B13; stroke: #F0997B; }
      .amsp-title { fill: #FAECE7; }
      .amsp-sub { fill: #F5C4B3; }
    }
  </style>

  <rect class="layer-rect" x="40" y="20" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="46" text-anchor="middle" dominant-baseline="central">Application layer</text>
  <text class="layer-sub" x="340" y="70" text-anchor="middle" dominant-baseline="central">ChatGPT, Claude, Codex, enterprise copilots</text>

  <rect class="layer-rect" x="40" y="100" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="126" text-anchor="middle" dominant-baseline="central">Orchestration layer</text>
  <text class="layer-sub" x="340" y="150" text-anchor="middle" dominant-baseline="central">Agent SDKs, planners, session managers</text>

  <rect class="layer-rect" x="40" y="180" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="206" text-anchor="middle" dominant-baseline="central">Agent interop layer</text>
  <text class="layer-sub" x="340" y="230" text-anchor="middle" dominant-baseline="central">A2A — discover, delegate, return</text>

  <rect class="layer-rect" x="40" y="260" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="286" text-anchor="middle" dominant-baseline="central">Tool and resource access</text>
  <text class="layer-sub" x="340" y="310" text-anchor="middle" dominant-baseline="central">MCP — files, APIs, databases, workflows</text>

  <rect class="amsp-rect" x="40" y="340" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="amsp-title" x="340" y="366" text-anchor="middle" dominant-baseline="central">Memory and state interop</text>
  <text class="amsp-sub" x="340" y="390" text-anchor="middle" dominant-baseline="central">AMSP — portable, governed state</text>

  <rect class="layer-rect" x="40" y="420" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="446" text-anchor="middle" dominant-baseline="central">Runtime and storage</text>
  <text class="layer-sub" x="340" y="470" text-anchor="middle" dominant-baseline="central">SQL, vector DBs, Durable Objects</text>
</svg>
