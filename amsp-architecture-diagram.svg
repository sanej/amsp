<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AMSP runtime architecture</title>
  <desc id="desc">Runtime architecture of an AMSP implementation. An agent or client talks to a Memory API and Router. The agent has a local working store. The router dispatches to a durable memory store. Downstream of durable storage sit the index, search, and embeddings subsystem, and the policy, ACL, and audit layer. Governance is foundational, not an afterthought.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .box-rect { fill: #FFFFFF; stroke: #D4D4D0; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1F2937; }
    .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #6B7280; }
    .hub-rect { fill: #EEF2F8; stroke: #1E3A5F; }
    .hub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1E3A5F; }
    .hub-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #3B5578; }
    .connector { stroke: #6B7280; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box-rect { fill: #1F2937; stroke: #4B5563; }
      .box-title { fill: #F3F4F6; }
      .box-sub { fill: #9CA3AF; }
      .hub-rect { fill: #1E3A5F; stroke: #93B4D9; }
      .hub-title { fill: #DBE7F3; }
      .hub-sub { fill: #93B4D9; }
      .connector { stroke: #9CA3AF; }
    }
  </style>

  <rect class="box-rect" x="40" y="40" width="260" height="72" rx="8" stroke-width="0.5"/>
  <text class="box-title" x="170" y="66" text-anchor="middle" dominant-baseline="central">Agent / Client A</text>
  <text class="box-sub" x="170" y="90" text-anchor="middle" dominant-baseline="central">AMSP consumer</text>

  <rect class="hub-rect" x="380" y="40" width="260" height="72" rx="8" stroke-width="0.5"/>
  <text class="hub-title" x="510" y="66" text-anchor="middle" dominant-baseline="central">Memory API / Router</text>
  <text class="hub-sub" x="510" y="90" text-anchor="middle" dominant-baseline="central">AMSP operations surface</text>

  <line class="connector" x1="300" y1="76" x2="380" y2="76" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect class="box-rect" x="40" y="160" width="260" height="72" rx="8" stroke-width="0.5"/>
  <text class="box-title" x="170" y="186" text-anchor="middle" dominant-baseline="central">Local working store</text>
  <text class="box-sub" x="170" y="210" text-anchor="middle" dominant-baseline="central">Session-scoped, agent-side</text>

  <rect class="box-rect" x="380" y="160" width="260" height="72" rx="8" stroke-width="0.5"/>
  <text class="box-title" x="510" y="186" text-anchor="middle" dominant-baseline="central">Durable memory store</text>
  <text class="box-sub" x="510" y="210" text-anchor="middle" dominant-baseline="central">Persistent, governed</text>

  <line class="connector" x1="170" y1="112" x2="170" y2="160" marker-end="url(#arrow)"/>
  <line class="connector" x1="510" y1="112" x2="510" y2="160" marker-end="url(#arrow)"/>

  <rect class="box-rect" x="260" y="280" width="380" height="72" rx="8" stroke-width="0.5"/>
  <text class="box-title" x="450" y="306" text-anchor="middle" dominant-baseline="central">Index, search, embeddings</text>
  <text class="box-sub" x="450" y="330" text-anchor="middle" dominant-baseline="central">Retrieval, separated from storage</text>

  <line class="connector" x1="510" y1="232" x2="510" y2="280" marker-end="url(#arrow)"/>

  <rect class="box-rect" x="40" y="400" width="600" height="72" rx="8" stroke-width="0.5"/>
  <text class="box-title" x="340" y="426" text-anchor="middle" dominant-baseline="central">Policy, ACL, audit</text>
  <text class="box-sub" x="340" y="450" text-anchor="middle" dominant-baseline="central">Governance underpins every operation</text>

  <line class="connector" x1="450" y1="352" x2="450" y2="400" marker-end="url(#arrow)"/>
</svg>
